name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write # Codecov upload via OIDC (no token secret needed)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    # Xcode 27 preview image (macOS 27 SDK, Swift 6.4), matching local development.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - name: Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test with coverage
        run: |
          scripts/coverage.sh | tee coverage-summary.txt
          echo "### $(tail -1 coverage-summary.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: false # a Codecov outage shouldn't fail CI

      - name: Build app bundle
        run: scripts/build-app.sh
