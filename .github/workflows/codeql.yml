name: CodeQL

# Advanced CodeQL setup (replaces GitHub's default setup, which built Swift on an
# older Xcode). Swift is analyzed on the same Xcode 27 image as CI.
on:
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/**"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, keeps main's results current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      security-events: write # upload results
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: xcode-27
            build-mode: manual
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.2
        if: matrix.language == 'swift'
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      # CodeQL's Swift tracer runs SwiftPM's manifest step as x86_64; the arm64 runner
      # image has no Rosetta, which fails with "Bad CPU type in executable (86)".
      - name: Install Rosetta
        if: matrix.language == 'swift'
        run: |
          if ! /usr/bin/pgrep -q oahd; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build (traced by CodeQL)
        if: matrix.build-mode == 'manual'
        run: swift build --build-tests

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
