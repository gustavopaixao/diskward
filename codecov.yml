# https://docs.codecov.com/docs/codecovyml-reference
coverage:
  precision: 1
  round: down
  status:
    # Informational only: coverage never blocks a merge.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: false

ignore:
  - "Tests/**"
